    <text x="110" y="65" fill="#650000" font-family="sans-serif" font-size="22" font-weight="800">Identify Unused Display Space</text>
    <text x="30" y="120" fill="#5F5F5F" font-family="sans-serif" font-size="16" font-weight="500">Locate available counters, shelves, or floor corners.</text>
  </g>

  <g transform="translate(640, 220)">
